<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>프렛 코치 · 폰 화면 미리보기</title>
<style>
  html,body{margin:0;height:100%;background:#05070a;font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#8c95a9}
  .wrap{min-height:100%;display:flex;align-items:center;justify-content:center;gap:28px;padding:24px;flex-wrap:wrap}
  .phone{width:390px;height:844px;border-radius:42px;border:10px solid #1b2029;box-shadow:0 30px 80px rgba(0,0,0,.7);overflow:hidden;background:#0e1014;position:relative}
  .phone iframe{width:100%;height:100%;border:0;display:block}
  .note{max-width:320px;font-size:13px;line-height:1.7}
  .note b{color:#e9edf5;display:block;font-size:15px;margin-bottom:8px}
  a{color:#ffb64d}
  @media (max-width:900px){ .note{display:none} .phone{width:100%;height:calc(100vh - 48px);border-radius:18px;border-width:6px} }
</style>
</head>
<body>
<div class="wrap">
  <div class="phone"><iframe src="./index.html?v=20261122s" title="프렛 코치"></iframe></div>
  <div class="note">
    <b>폰 화면 미리보기</b>
    실제 앱은 <a href="./index.html?v=20261122s">index.html</a> 하나로 동작합니다. 이 페이지는 데스크톱에서 390×844 폰 크기로 확인하려고 만든 보조 페이지입니다.
  </div>
</div>
<script>
(function () {
  function fit() {
    var phone = document.querySelector('.phone');
    var avail = window.innerHeight - 48;
    var s = Math.min(1, avail / 844);
    phone.style.transform = 'scale(' + s.toFixed(3) + ')';
    phone.style.transformOrigin = 'center center';
    phone.style.marginBottom = ((s - 1) * 844) + 'px';
  }
  window.addEventListener('resize', fit);
  fit();
})();
</script>
</body>
</html>
